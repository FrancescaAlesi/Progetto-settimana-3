<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pellicola</title>
        <link rel="stylesheet" href="assets/css/style.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <header id="header">
            <h1>Pellicola</h1>
            <p id="paragrafo">Aggiungi i film che hai visto o che vorresti vedere.</p>
            <button type="button" id="pulsante" title="Cambia tema"></button>
        </header>

        <main>
            <section class="form">
                <h2>Aggiungi un film</h2>
                <form>
                    <div class="aggiunta">
      		            <input type="text" id="nuovo-titolo" placeholder="Titolo"/>
                        <input type="text" id="nuovo-regista" placeholder="Regista"/>
                        <input type="number" id="nuovo-anno" placeholder="Anno"/>
                        <select id="scelta">
                            <option value="">Scelta</option>
                            <option value="visto">Visto</option>
                            <option value="da-vadere">Da vedere</option>
                        </select>
                        <button type="submit" id="bottone-aggiungi">
                            <i id="icona" class="fa-solid fa-plus"></i> 
                            Aggiungi
                        </button>
    	            </div>
                </form>
            </section>

            <section class="controlli">
                <div class="cerca">
                    <input type="text" id="cerca" placeholder="Cerca per titolo o regista" />
                    <select id="ordinamento">
                        <option value="">Ordinamento predefinito</option>
                        <option value="anno-cresc">Anno crescente</option>
                        <option value="anno-decresc">Anno decrescente</option>
                        <option value="titolo-az">Titolo: A-Z </option>
                        <option value="titolo-za">Titolo: Z-A</option>
                    </select>
                </div>

                <div class="filtri">
      		        <button type="button" class="bottone-filtro attivo" id="tutti">Tutti</button>
      		        <button type="button" class="bottone-filtro" id="visti">Solo visti</button>
      		        <button type="button" class="bottone-filtro" id="da-vedere">Solo da vedere</button>
    	        </div>
                
            </section>

            <section class="statistiche">
                <h2>Statistiche</h2>
      
                <div>
                    <div>
                        <p class="conteggio-totale">Tutti: <span id="contatore-totale">0</span></p>
                        <p class="conteggio-visti">Film visti: <span id="conteggio-visti">0</span></p>
                        <p class="conteggio-da-vedere">Film da vedere: <span id="conteggio-da-vedere">0</span></p>
                    </div>

                    <div class="barra">
                       <div class="barra-fill" id="barra-percentuale" style="width: 0%;"></div>
                    </div>
                </div>
            </section>

            <section class="lista">
                <ul id="lista-film"></ul>
            </section>

        </main>

        <footer>
            <p>Organizzazione di film - Epicode Full Stack AI 2026</p>
        </footer>

        <script src="assets/js/script.js"></script>
    </body>
</html>
